apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      containers:
        - name: code-server
          image: lscr.io/linuxserver/code-server:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
            - name: PASSWORD
              value: "asdfg123!" # Bitte anpassen!
            - name: DEFAULT_WORKSPACE
              value: "/config/workspace"
          ports:
            - containerPort: 8443
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
          volumeMounts:
            - name: config-storage
              mountPath: /config
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: code-server-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: code-server-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: 8443
      name: http
  selector:
    app: code-server
